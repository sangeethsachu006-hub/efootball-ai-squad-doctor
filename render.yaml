services:
  - type: web
    name: efootball-ai-squad-doctor
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: VISION_MODEL
        value: gpt-5.6-luna
      - key: PUBLIC_URL
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
